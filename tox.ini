[tox]
envlist =
  py310
  py311
  py312
  py313
  pypy3
  pre-commit
  mypy

[testenv]
deps =
  pytest
  pytest-xdist
commands =
  pytest {posargs:-n auto}

[testenv:docs]
deps =
  alabaster
  myst-parser
  sphinx
commands =
  sphinx-build -W --keep-going --color -b html docs docs/_build
  sphinx-build -W --keep-going --color -b linkcheck docs docs/_build

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure {posargs}

[testenv:mypy]
deps =
  mypy
  pytest
commands =
  mypy --strict src tests
