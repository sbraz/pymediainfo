# https://packaging.python.org/en/latest/specifications/pyproject-toml/
[build-system]
requires = ["pdm-backend", "wheel>=0.42"]
build-backend = "pdm.backend"

[project]
name = "pymediainfo"
description = "A Python wrapper for the MediaInfo library."
authors = [
    {name = "Louis Sautier", email = "sautier.louis@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
tests = [
    "pytest>=6",
    "pytest-cov",
    "pytest-xdist",
]
docs = [
    "alabaster",
    "myst-parser",
    "sphinx",
]
dev = [
    "ipython",
    "mypy>=1.0",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/sbraz/pymediainfo"
Documentation = "https://pymediainfo.readthedocs.io/"
Bugs = "https://github.com/sbraz/pymediainfo/issues"


# Version of the MediaInfo library bundled in the wheels and BLAKE2b hashes
# of the files downloaded from MediaArea, indexed by what follows
# MediaInfo_DLL_<version>_ in their names. Updated by
# scripts/update_bundled_library.py.
[tool.pymediainfo.bundled-library]
version = "24.12"

[tool.pymediainfo.bundled-library.blake2b]
"Lambda_arm64.zip" = "4e5a9826fa987f4bde46a6586894d45f3d5381f25d8886dfef67f5db3a9f4377ecafc12acc6e2d71e43b062b686c2db2523052a1f3dd7505a41091847788d114"
"Lambda_x86_64.zip" = "13c4afb2948187cc06f13b1cd7d7a49f8618b8d1e3a440d9e96ef7b486a653d5e2567aae97dc253e3d3f484a7837e4b5a972abab4803223300a79c601c0bcce1"
"Mac_x86_64+arm64.tar.bz2" = "65b8195f0859369fa0ab1870cbde1535bb57f16bde451b22585d849c870f1ca92972328c11edd15b6f8187445dd58efff7107cfce39d2be7a88e8c434589b4ae"
"Windows_i386_WithoutInstaller.zip" = "0f0e14c103eac858fe683ec7d51634d62e5e0af658940fd26608249f1048846a92a334438204fe5ecfceb70cb00e5550bfb717a77f10816a2583b5041bb61790"
"Windows_x64_WithoutInstaller.zip" = "f831c588e9eaf51201b4cc7995dce66852591764fc5ef05effd3a8a2037ff5d37ec039eef5d1f990f05bd7452c1cad720e95b77a095f9f1a690689e351fc00b8"

# https://pdm-project.org/latest/
[tool.pdm.version]
source = "scm"

[tool.pdm.dev-dependencies]
download_library = ["wheel>=0.44", "requests", "tomlkit"]

[tool.pdm.build]
source-includes = ["docs/", "scripts/", "tests/"]

[tool.pdm.scripts.types]
help = "Check type hints"
cmd = "mypy --install-types --non-interactive --config-file=pyproject.toml {args:src tests scripts}"

[tool.pdm.scripts.docs]
help = "Build and test documentation"
composite = [
  "sphinx-build -W --keep-going --color -b html docs docs/_build",
  "sphinx-build -W --keep-going --color -b linkcheck docs docs/_build",
]

[tool.pdm.scripts.test-nocov]
help = "Run tests without coverage"
cmd = "pytest {args:-n auto}"

[tool.pdm.scripts.test]
help = "Run tests with coverage"
cmd = "pytest --cov --cov-report=term-missing --cov-config=pyproject.toml {args:-n auto}"

[tool.pdm.scripts.download_library]
help = "Download mediainfo library"
cmd = "python scripts/download_library.py {args}"

[tool.pdm.scripts.clean_library]
help = "Clean mediainfo library"
cmd = "python scripts/download_library.py -c"

[tool.pdm.scripts.update_bundled_library]
help = "Update the bundled MediaInfo version (the latest by default) and its hashes"
cmd = "python scripts/update_bundled_library.py {args}"

[tool.pdm.scripts.tag_wheel]
help = "Tag the wheels for a specific platform"
cmd = "python scripts/tag_pure_wheels.py"

[tool.pdm.scripts.build_linux_x86_64]
help = "Build wheel with bundled library for Linux x86_64"
composite = [
  "download_library -c -p linux -a x86_64",
  "pdm build -v --no-sdist",
  "tag_wheel manylinux_2_27_x86_64",
]

[tool.pdm.scripts.build_linux_arm64]
help = "Build wheel with bundled library for Linux arm64"
composite = [
  "download_library -c -p linux -a arm64",
  "pdm build -v --no-sdist",
  "tag_wheel manylinux_2_27_aarch64",
]

[tool.pdm.scripts.build_win32_x86_64]
help = "Build wheel with bundled library for Windows x64"
composite = [
  "download_library -c -p win32 -a x86_64",
  "pdm build -v --no-sdist",
  "tag_wheel win_amd64",
]

[tool.pdm.scripts.build_win32_i386]
help = "Build wheel with bundled library for Windows x32"
composite = [
  "download_library -c -p win32 -a i386",
  "pdm build -v --no-sdist",
  "tag_wheel win32",
]

[tool.pdm.scripts.build_darwin]
help = "Build wheel with bundled library for MacOS x86_64 and arm64"
composite = [
  # -a doesn't matter as the file works with both x86_64 and arm64 (Mac_x86_64+arm64.tar.bz2)
  "download_library -c -p darwin -a arm64",
  "pdm build -v --no-sdist",
  "tag_wheel macosx_10_10_universal2",
]

[tool.pdm.scripts.build_all]
help = "Build all the wheels with bundled library and the sdist and wheel without library"
composite = [
  "build_linux_arm64",
  "build_linux_x86_64",
  "build_win32_x86_64",
  "build_win32_i386",
  "build_darwin",
  # remove any library before building sdist and barebone wheel
  "clean_library",
  "pdm build",
]


# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
# global-only flags
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pymediainfo.*"]
strict = true


[tool.pytest.ini_options]
addopts = "-vv -r a"


# https://coverage.readthedocs.io/en/stable/
[tool.coverage.run]
source_pkgs = ["pymediainfo"]
branch = true


# https://docs.astral.sh/ruff/
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# The pep257 convention below enforces no position for the summary line of
# multi-line docstrings, so select D213 to keep it on the line after the
# opening quotes
extend-select = ["D213"]
ignore = [
    "CPY001",  # flake8-copyright
    "D105",    # pydocstyle
    "D107",
    "COM812",  # flake8-commas, conflicts with `ruff format`
    "PERF203", # Perflint
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
    "S101",
    "INP001",
    "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
