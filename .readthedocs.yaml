# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    # Read the Docs makes a shallow clone without tags, but the version is
    # computed from the latest git tag, see
    # https://docs.readthedocs.com/platform/stable/build-customization.html#unshallow-git-clone
    post_checkout:
      - git fetch --unshallow --tags || true

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

# Install the required dependencies
python:
  install:
    - requirements: docs/requirements.txt
    # Install pymediainfo itself to make autodoc work
    - path: .
